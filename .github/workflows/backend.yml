name: Backend Integration Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    # Run tests using a Postgres service container
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: nutrition_db
          POSTGRES_USER: nutrition_user
          POSTGRES_PASSWORD: nutrition_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Set up environment variables
      run: |
        echo "DATABASE_URL=postgres://nutrition_user:nutrition_pass@localhost:5432/nutrition_db?sslmode=disable" >> $GITHUB_ENV
        # Setting a dummy API key to bypass nil agent runner errors if tests require it
        echo "GOOGLE_API_KEY=dummy_key" >> $GITHUB_ENV
        cp .env.example .env

    - name: Generate SQLC code
      run: cd server && go run github.com/sqlc-dev/sqlc/cmd/sqlc@latest generate

    - name: Test Server
      run: cd server && go test ./...
